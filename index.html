<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ollama Web UI</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <div class="title">🧠 Ollama Web UI</div>
      <div class="model-controls">
        <label for="model-select">Model</label>
        <select id="model-select" aria-label="Choose model"></select>
        <label for="size-select">Size</label>
        <select id="size-select" aria-label="Choose model size"></select>
        <button type="button" id="pull-model">Pull Model</button>
      </div>
      <div id="model-description" class="model-description" aria-live="polite"></div>
    </header>

    <main id="chat-container" aria-live="polite"></main>

    <div id="upload-area">
      <input type="file" id="file-input" multiple />
      <div class="upload-controls">
        <label for="file-input">📎 Upload File(s)</label>
        <button type="button" id="analyze-files-btn" disabled>Analyze Files</button>
        <button type="button" id="clear-files-btn" disabled>Clear Files</button>
      </div>
      <div id="file-preview"></div>
    </div>

    <footer>
      <form id="prompt-form">
        <input
          type="text"
          id="prompt-input"
          placeholder="Send a message..."
          autocomplete="off"
          required
        />
        <button type="submit" id="submit-btn">Send</button>
      </form>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
